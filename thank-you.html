<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | Stay In Home Care</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="./critical.css">
    
    <style>
        body {
            font-family: 'DM Sans', sans-serif;
            background: radial-gradient(circle at 50% 50%, #f4f8ff 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            color: #0f172a;
        }

        .thank-you-card {
            background: #ffffff;
            border: 1px solid #f1f5f9;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.05);
            border-radius: 24px;
            padding: 48px 32px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animated Checkmark SVG */
        .checkmark-wrapper {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: block;
            stroke-width: 3;
            stroke: #1a56db;
            stroke-miterlimit: 10;
            box-shadow: inset 0px 0px 0px #1a56db;
            animation: fill .4s ease-in-out .4s forwards, scale .3s ease-in-out .9s forwards;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #1a56db;
            fill: none;
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            stroke: #1a56db;
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.8s forwards;
        }

        @keyframes stroke {
            100% {
                stroke-dashoffset: 0;
            }
        }

        @keyframes scale {
            0%, 100% {
                transform: none;
            }
            50% {
                transform: scale3d(1.1, 1.1, 1);
            }
        }

        @keyframes fill {
            100% {
                box-shadow: inset 0px 0px 0px 40px rgba(26, 86, 219, 0.05);
            }
        }

        /* Typography & Layout spacing */
        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #0f172a;
            margin: 0 0 12px 0;
            line-height: 1.2;
        }

        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #475569;
            margin: 0 0 24px 0;
        }

        .countdown-text {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 32px;
        }

        #countdown {
            font-weight: 700;
            color: #1a56db;
        }

        /* Sleek premium CTA button */
        .btn-home {
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            background-color: #1a56db;
            color: #ffffff;
            border: 2px solid #1a56db;
            box-shadow: 0 8px 20px rgba(26, 86, 219, 0.15);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-home:hover {
            background-color: #1e40af;
            border-color: #1e40af;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(26, 86, 219, 0.25);
        }

        .btn-home:active {
            transform: translateY(1px);
        }

        .btn-home svg {
            width: 20px;
            height: 20px;
        }

        /* Element Fade-in Animations */
        .fade-in {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .delay-1 {
            animation-delay: 0.3s;
        }

        .delay-2 {
            animation-delay: 0.5s;
        }

        .delay-3 {
            animation-delay: 0.7s;
        }

        .delay-4 {
            animation-delay: 0.9s;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .thank-you-card {
                padding: 36px 20px;
            }
            h1 {
                font-size: 1.75rem;
            }
            p {
                font-size: 0.95rem;
            }
            .btn-home {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TN8KHNGM"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <div class="thank-you-card">
        <div class="checkmark-wrapper">
            <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
                <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>
        </div>

        <h1 class="fade-in delay-1">Thank You!</h1>
        <p class="fade-in delay-2">Your request has been successfully submitted. Our local Dallas care coordinators will reach out to you shortly.</p>
        
        <p class="fade-in delay-3 countdown-text">
            You will be automatically redirected to the homepage in <span id="countdown">10</span> seconds...
        </p>

        <div class="fade-in delay-4">
            <a href="./" class="btn-home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Return to Home
            </a>
        </div>
    </div>

    <script>
        // Automatic redirection countdown
        let count = 10;
        const countdownEl = document.getElementById('countdown');
        const interval = setInterval(() => {
            count--;
            countdownEl.textContent = count;
            if (count <= 0) {
                clearInterval(interval);
                window.location.href = './';
            }
        }, 1000);
    </script>
</body>
</html>
